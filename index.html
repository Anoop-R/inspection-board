<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Inspection Readiness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&family=Didact+Gothic&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, exact field tool for the walk-around before the client arrives.
   IDEA: the inspection tag board in a mine workshop: one tag per machine, flipped green when signed off.
   PICTURE: the overall readiness meter + per-fleet bars on top, then the tag board itself.
   COLOUR/TYPE: laterite red-earth + graphite on warm stone; sign-off green; Archivo + Archivo Narrow for fleet numbers.
   LAYOUT: sticky header with meter, fleet filter chips, grouped card grid; one column on phones. */
:root{color-scheme:light;--hdr:#2d3a44;--hdrink:#f3f1ec;
--bg:#f3f1ec;--panel:#ffffff;--ink:#1a1c1e;--mute:#6b6862;--line:#e2ded6;--earth:#b0442a;--slate:#2d3a44;
--ok:#18805a;--okbg:#e3f3ec;--okline:#8cc9ae;--bad:#c22f2f;--badbg:#fbe5e3;--badline:#e9a3a3;
--prog:#2f63b8;--progbg:#e5ecf8;--na:#8a867f;--nabg:#ecebe7;--glass:rgba(243,241,236,.94)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--hdr:#1f2a32;--hdrink:#eceae6;
--bg:#121416;--panel:#1b1e21;--ink:#eceae6;--mute:#9a9893;--line:#2b2f33;--earth:#e0714f;--slate:#c9d3da;
--ok:#3fc08c;--okbg:#13302a;--okline:#2a6b52;--bad:#ff6b6b;--badbg:#3a1a1a;--badline:#7a3333;
--prog:#7ea6ec;--progbg:#18243a;--na:#77746f;--nabg:#222528;--glass:rgba(18,20,22,.94)}}
:root[data-theme=dark]{color-scheme:dark;--hdr:#1f2a32;--hdrink:#eceae6;
--bg:#121416;--panel:#1b1e21;--ink:#eceae6;--mute:#9a9893;--line:#2b2f33;--earth:#e0714f;--slate:#c9d3da;
--ok:#3fc08c;--okbg:#13302a;--okline:#2a6b52;--bad:#ff6b6b;--badbg:#3a1a1a;--badline:#7a3333;
--prog:#7ea6ec;--progbg:#18243a;--na:#77746f;--nabg:#222528;--glass:rgba(18,20,22,.94)}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--earth);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,14px)}
header{background:var(--hdr);color:var(--hdrink);padding-top:max(22px,env(safe-area-inset-top));padding:22px 0 18px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
h1{font-size:clamp(26px,4vw,40px);line-height:1.05;margin:0;text-wrap:balance;font-weight:800}
.sub{margin:6px 0 0;opacity:.8;font-size:14px}
.live{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--na)}
.dot.on{background:#3fc08c;box-shadow:0 0 0 4px #3fc08c33}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;font:700 26px/1 'Archivo Narrow',Archivo,system-ui,sans-serif;text-align:center}
.ring b small{display:block;font:500 12px/1.2 Archivo;opacity:.8}
.ringarc{transition:stroke-dashoffset .6s ease}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stat{background:#ffffff14;border:1px solid #ffffff26;border-radius:10px;padding:6px 12px;font-size:14px;white-space:nowrap}
.stat b{font-family:'Archivo Narrow',Archivo,system-ui,sans-serif;font-size:18px;margin-right:4px}
.bar{position:sticky;top:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 420px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 14px;height:40px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 120px;height:40px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px;font-size:16px}
.sel{height:40px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 10px;font-size:15px}
main{padding:18px 0 100px}
.group{margin-bottom:28px}
.ghead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:end;margin-bottom:10px}
.ghead h2{margin:0;font-size:20px;font-weight:700}
.gcount{font:700 16px 'Archivo Narrow',Archivo,system-ui,sans-serif;color:var(--mute);white-space:nowrap}
.gbar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ok);transition:width .5s ease}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;align-items:center;transition:border-color .25s,background .25s}
.card.ready{border-color:var(--okline);background:linear-gradient(var(--okbg),var(--panel) 70%)}
.card.issue{border-color:var(--badline)}
.card.na{opacity:.72}
.tick{grid-row:span 2;width:52px;height:52px;border-radius:12px;border:3px solid var(--mute);background:var(--panel);cursor:pointer;display:grid;place-items:center;transition:all .2s}
.tick:hover{border-color:var(--ok)}
.tick svg{width:30px;height:30px;stroke:var(--line);stroke-width:3.4;fill:none;transition:stroke .2s}
.tick[aria-checked=true]{background:var(--ok);border-color:var(--ok)}
.tick[aria-checked=true] svg{stroke:#fff}
.done{grid-column:1/-1;margin-top:8px;height:46px;border-radius:10px;border:2px solid var(--ok);background:transparent;color:var(--ok);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.done svg{width:20px;height:20px;stroke:currentColor;stroke-width:3;fill:none}
.done[aria-pressed=true]{background:var(--ok);color:#fff}
.done:disabled{border-color:var(--line);color:var(--mute);cursor:not-allowed}
.tick:disabled{cursor:not-allowed;opacity:.5}
.name{font:700 21px/1.1 'Archivo Narrow',Archivo,system-ui,sans-serif;letter-spacing:.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{font-size:12.5px;color:var(--mute);line-height:1.3;min-height:16px}
.row2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.status{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);padding:0 8px;font-size:15px;font-weight:600;cursor:pointer}
.s-pending{background:var(--panel)}.s-progress{background:var(--progbg);color:var(--prog)}.s-issue{background:var(--badbg);color:var(--bad)}
.s-ready{background:var(--okbg);color:var(--ok)}.s-na{background:var(--nabg);color:var(--na)}
.ib{width:44px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;position:relative}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.ib.wide{width:auto;display:flex;gap:6px;padding:0 10px;font-size:13.5px;font-weight:600;white-space:nowrap}
.row2 .status{flex:1 1 110px}
.ib.has{color:var(--earth);border-color:var(--earth)}
.ib.has::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--earth)}
.note{grid-column:1/-1;font-size:13.5px;color:var(--slate);background:var(--bg);border-radius:8px;padding:6px 9px;margin-top:6px;overflow-wrap:anywhere}
.tag{font:600 11.5px Archivo;padding:2px 7px;border-radius:6px;background:var(--nabg);color:var(--na)}
.empty,.msg{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.msg.err{color:var(--bad);border-color:var(--bad)}
.fab{position:fixed;right:18px;bottom:max(18px,env(safe-area-inset-bottom));height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--earth);color:#fff;font-weight:700;box-shadow:0 8px 24px #0004;cursor:pointer;z-index:6}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,94vw);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0008}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:22px;font-family:'Archivo Narrow'}
.dlg label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.dlg input,.dlg textarea,.dlg select{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:var(--bg);color:var(--ink)}
.dlg textarea{min-height:80px;resize:vertical}
.photo{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:var(--bg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.btn.pri{background:var(--earth);border-color:var(--earth);color:#fff}
.btn.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:all .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;order:2}
.seg .chip{height:36px;font-size:13.5px}
.seg .seg-ready[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .seg-issue[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.tools .search{order:3}.tools .rbtn{order:4}
button.stat{color:inherit;cursor:pointer;font:inherit;font-size:14px}
.lockrow{grid-column:1/-1;margin-top:8px;display:flex;gap:6px}
.lockbadge{flex:1;height:46px;border-radius:10px;background:var(--ok);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.lockbadge svg,.relock svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.editbtn{height:46px;padding:0 18px;border-radius:10px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-weight:700;cursor:pointer}
.status:disabled{opacity:.75;cursor:not-allowed}.ib:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:14px}
.rbtn{height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--earth);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
/* photo gallery */
.gsub{margin:-4px 0 0;font-size:14px;color:var(--mute)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:58vh;overflow:auto;padding:2px}
.gi{position:relative;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.gi.picked{border-color:var(--ok)}
.gview{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.gthumb{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.gnum{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.gbar2{display:flex;gap:4px;padding:6px}
.gb{flex:1;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.gb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.gb.del{color:var(--bad)}.gb.del.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
button.gi{padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pick{max-height:62vh;overflow:auto;display:grid;gap:14px}.pick .gal{max-height:none;overflow:visible}.pan{font-weight:700;margin:0 0 6px;font-family:'Archivo Narrow',Archivo,sans-serif;font-size:17px}
.gmeta{font-size:11.5px;color:var(--mute);padding:0 8px 6px;min-height:18px}
#viewer{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px 12px}
#viewer[hidden]{display:none}
.vimg{max-width:100%;max-height:100%;object-fit:contain}
.vclose{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:18px;cursor:pointer}

/* sign-off documents viewer */
#report{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;overflow:auto;background:#d9d6d0;-webkit-overflow-scrolling:touch}
.rtools{position:sticky;top:0;z-index:2;background:#262626;padding:8px max(3vw,10px) 8px;padding-top:max(8px,env(safe-area-inset-top));display:grid;gap:8px}
.dtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.dtab{flex:none;height:38px;padding:0 12px;border-radius:999px;border:1px solid #555;background:transparent;color:#eee;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.dtab small{opacity:.7;font-weight:500;margin-left:2px}
.dtab[aria-pressed=true]{background:#C04F15;border-color:#C04F15;color:#fff}
.dact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dact .btn{height:38px}
.dchk{display:flex;align-items:center;gap:6px;color:#eee;font-size:14px;cursor:pointer}
.dchk input{width:18px;height:18px}
#dinfo{color:#bbb;font-size:13px;margin-right:auto}
#pages{padding:12px 8px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pgw{position:relative;flex:none}
.pgs{position:absolute;top:0;left:0;transform:scale(var(--s,1));transform-origin:0 0;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.dempty{padding:40px 16px;color:#333}

<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div>
        <h1>Client inspection readiness</h1>
        <p class="sub"><span class="live"><span class="dot" id="dot"></span><span id="sync">Connecting to shared sheet…</span></span> · <button class="linkbtn" id="who">Add your name (optional)</button></p>
      </div>
      <div class="ring" aria-label="Overall readiness">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="#ffffff22" stroke-width="12" fill="none"/>
        <circle id="arc" class="ringarc" cx="60" cy="60" r="50" stroke="#3fc08c" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"/></svg>
        <b><span><span id="pct">0%</span><small>complete</small></span></b>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>
<div class="bar"><div class="wrap tools">
  <div class="chips" id="chips" role="toolbar" aria-label="Asset type"></div>
  <input class="search" id="q" type="search" placeholder="Search asset…" aria-label="Search asset">
  <div class="seg" id="sf" role="toolbar" aria-label="Filter by status"></div>
  <button class="rbtn" id="repBtn">Sign-off documents</button>
</div></div>
<main class="wrap" id="board"><div class="msg">Loading assets…</div></main>
<button class="fab" id="addBtn" hidden>+ Add asset</button>
<input type="file" id="file" accept="image/*" multiple hidden>

<dialog id="dlg"><form class="dlg" id="dform" method="dialog"></form></dialog>
<div class="toast" id="toast"></div>
<div id="report" hidden></div>
<div id="viewer" hidden></div>

<script>
{
/* ==== PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends with /exec) ==== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwR021DC4aiCbXa8kSPqFi2zvzeUnf-Nohr9t3FlIxAGz2VUsxCc3EAEjhrv7FJfOI/exec';
/* =================================================================== */
const POLL_MS=10000;
const ST={pending:'Pending',progress:'In progress',issue:'Issue',ready:'Completed',na:'Not in scope'};
const TYPES=['Articulated dump trucks','Excavators','Track dozers','Wheel loaders','Fuel trucks','Motor grader'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const IC={cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 note:'<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/></svg>',
 tick:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let unlocked=new Set(),assets=[],filt=store.get('ir.filter')||'All',q='',sf='',photoTarget=null,me=store.get('ir.name')||'',inflight=0,lastOk=0;
const canWrite=true;
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)};
const ago=ts=>{if(!ts)return'';const m=Math.round((Date.now()-ts)/60000);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
const natural=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true});

/* ---- API (text/plain POST avoids CORS preflight with Apps Script) ---- */
async function apiGet(params){
  const u=API_URL+'?'+new URLSearchParams({...params,_:Date.now()});
  const r=await fetch(u,{redirect:'follow'});const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j;
}
async function apiPost(body){
  inflight++;
  try{const r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,by:me})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j}
  finally{inflight--}
}

function counts(list){const c={pending:0,progress:0,issue:0,ready:0,na:0};list.forEach(a=>c[a.status in c?a.status:'pending']++);c.scope=list.length-c.na;return c}

function renderHead(){
  const c=counts(assets),p=c.scope?Math.round(c.ready/c.scope*100):0;
  $('pct').textContent=p+'%';$('arc').style.strokeDashoffset=314.16*(1-p/100);
  $('stats').innerHTML=[[c.ready+' / '+c.scope,'completed','ready'],[c.pending+c.progress,'open','open'],[c.issue,'issues','issue'],[c.na,'not in scope','na']]
   .map(([v,l,k])=>`<button class="stat" data-sf="${k}"><b>${esc(v)}</b>${l}</button>`).join('');
  const segs=[['','All statuses',assets.length],['open','Open',c.pending+c.progress],['ready','Completed',c.ready],['issue','Issues',c.issue],['na','Not in scope',c.na]];
  $('sf').innerHTML=segs.map(([k,l,n])=>`<button class="chip seg-${k||'all'}" data-sf="${k}" aria-pressed="${k===sf}">${l} · ${n}</button>`).join('');
  const types=['All',...TYPES.filter(t=>assets.some(a=>a.type===t)),...[...new Set(assets.map(a=>a.type))].filter(t=>!TYPES.includes(t))];
  if(!types.includes(filt))filt='All';
  $('chips').innerHTML=types.map(t=>{const l=t==='All'?assets.length:assets.filter(a=>a.type===t).length;return`<button class="chip" data-t="${esc(t)}" aria-pressed="${t===filt}">${esc(t)} · ${l}</button>`}).join('');
}

const isLocked=a=>a.status==='ready'&&!unlocked.has(a.id);
const LOCK='<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function card(a){
  const done=a.status==='ready',na=a.status==='na',lk=isLocked(a);
  const meta=a.at?`${esc(ST[a.status])} · ${esc(a.by||'Someone')} · ${esc(ago(a.at))}`:'Not updated yet';
  return`<div class="card ${esc(a.status)}" data-id="${esc(a.id)}">
  <button class="tick" role="checkbox" aria-checked="${done}" aria-label="Mark ${esc(a.name)} complete" data-act="${lk?'edit':'tick'}" ${na?'disabled':''}>${IC.tick}</button>
  <div class="name">${esc(a.name)}${a.tag?`<span class="tag">${esc(a.tag)}</span>`:''}</div>
  <div class="meta">${meta}</div>
  ${lk?`<div class="lockrow"><span class="lockbadge">${LOCK}Completed · locked</span><button class="editbtn" data-act="edit">Edit</button></div>`
     :`<button class="done" data-act="tick" aria-pressed="${done}" ${na?'disabled':''}>${na?'Not in scope':done?IC.tick+'Completed — tap to undo':'Mark complete'}</button>`}
  <div class="row2">
   <select class="status s-${esc(a.status)}" data-act="status" aria-label="Status of ${esc(a.name)}" ${lk?'disabled':''}>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===a.status?'selected':''}>${v}</option>`).join('')}</select>
   <button class="ib wide ${a.photos.length?'has':''}" data-act="photo" ${lk&&!a.photos.length?'disabled':''}>${IC.cam}<span>${a.photos.length?'Photos · '+a.photos.length:'Add photo'}</span></button>
   <button class="ib wide ${a.note?'has':''}" data-act="note">${IC.note}<span>Note</span></button>
   ${done&&!lk?`<button class="ib wide relock" data-act="lock">${LOCK}<span>Lock</span></button>`:''}
  </div>${a.note?`<div class="note">${esc(a.note)}</div>`:''}</div>`;
}

function render(){
  renderHead();
  const ql=q.trim().toLowerCase().replace(/[\s-]/g,'');
  const vis=assets.filter(a=>(filt==='All'||a.type===filt)&&(!sf||(sf==='open'?(a.status==='pending'||a.status==='progress'):a.status===sf))&&(!ql||a.name.toLowerCase().replace(/[\s-]/g,'').includes(ql)));
  if(!assets.length){$('board').innerHTML='<div class="empty">No assets on the board yet.</div>';return}
  if(!vis.length){$('board').innerHTML='<div class="empty">No assets match this filter.</div>';return}
  const ord=t=>{const i=TYPES.indexOf(t);return i<0?99:i};
  const types=[...new Set(vis.map(a=>a.type))].sort((x,y)=>ord(x)-ord(y)||x.localeCompare(y));
  $('board').innerHTML=types.map(t=>{
    const all=assets.filter(a=>a.type===t),c=counts(all),p=c.scope?c.ready/c.scope*100:0,list=vis.filter(a=>a.type===t).sort(natural);
    return`<section class="group"><div class="ghead"><h2>${esc(t)}</h2><span class="gcount">${c.ready} / ${c.scope} done</span><div class="gbar"><i style="width:${p}%"></i></div></div>
    <div class="grid">${list.map(card).join('')}</div></section>`}).join('');
}

const busyRender=()=>!dlg.open&&!$('board').contains(document.activeElement);
function setSync(ok,text){$('dot').classList.toggle('on',ok);$('sync').textContent=text}

async function load(){
  if(inflight)return;
  try{
    const j=await apiGet({action:'list'});if(inflight)return;
    assets=(j.assets||[]).map(x=>({id:String(x.id),name:String(x.name||x.id),type:String(x.type||'Other'),status:ST[x.status]?x.status:'pending',
      tag:String(x.tag||''),note:String(x.note||''),photos:(Array.isArray(x.photos)?x.photos:[]).filter(p=>p&&typeof p.id==='string').map(p=>({id:p.id,at:Number(p.at)||0,by:String(p.by||'')})),picks:(Array.isArray(x.picks)?x.picks:[]).map(String),by:String(x.updatedBy||''),at:Number(x.updatedAt)||0}));
    docPicks=(j.docs&&typeof j.docs==='object')?j.docs:{};
    lastOk=Date.now();setSync(true,'Live · shared with everyone on this link');
    if(busyRender()||!$('board').querySelector('.card'))render();
    refreshDocs();
  }catch(e){
    setSync(false,lastOk?'Offline — showing last data, retrying…':'Can’t reach the shared sheet — retrying…');
    if(!assets.length)$('board').innerHTML='<div class="msg err">Can’t reach the shared sheet. Check your connection; it will retry automatically.</div>';
  }
}

async function save(id,patch){
  const a=assets.find(x=>x.id===id);if(!a)return;
  const before={status:a.status,note:a.note,by:a.by,at:a.at};
  Object.assign(a,patch,{by:me,at:Date.now()});if(patch.status==='ready')unlocked.delete(id);render();refreshDocs();
  try{await apiPost({action:'update',id,...patch})}
  catch(e){Object.assign(a,before);render();toast('Not saved — check connection and try again')}
}

/* ---- name (no sign-in: each person types their name once on this device) ---- */
const dlg=$('dlg'),form=$('dform');
function askName(then){
  form.innerHTML=`<h3>Your name (optional)</h3><label>Shown next to the updates you make<input id="nm" maxlength="40" autocomplete="name"></label>
  <div class="btns"><button class="btn" value="x" formnovalidate>Skip</button><button class="btn pri" value="ok">Save</button></div>`;
  $('nm').value=me;dlg.returnValue='';dlg.showModal();
  dlg.onclose=()=>{const v=dlg.returnValue==='ok'&&$('nm')?$('nm').value.trim():'';if(v){me=v;store.set('ir.name',v);$('who').textContent='You: '+v}
    if(then)then()};
}
const needName=fn=>fn();

$('board').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const id=b.closest('.card').dataset.id,a=assets.find(x=>x.id===id);if(!a)return;
  const act=b.dataset.act;
  if(act==='edit'){confirmEdit(a);return}
  if(act==='lock'){unlocked.delete(id);render();toast(a.name+' locked');return}
  if(isLocked(a)&&act!=='note'&&act!=='photo')return;
  if(act==='tick')needName(()=>{const to=a.status==='ready'?'pending':'ready';save(id,{status:to});toast(a.name+(to==='ready'?' marked complete':' set back to pending'))});
  if(act==='note')openNote(a);
  if(act==='photo'){if(a.photos.length)openGallery(a);else{photoTarget=id;$('file').click()}}
});
$('board').addEventListener('change',e=>{if(e.target.dataset.act==='status'){const id=e.target.closest('.card').dataset.id,v=e.target.value;needName(()=>save(id,{status:v}))}});
$('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){filt=c.dataset.t;store.set('ir.filter',filt);render()}});
$('q').addEventListener('input',e=>{q=e.target.value;render()});
const setSf=v=>{sf=v;render();window.scrollTo({top:0,behavior:'smooth'})};
$('sf').addEventListener('click',e=>{const c=e.target.closest('[data-sf]');if(c)setSf(sf===c.dataset.sf&&c.dataset.sf?'':c.dataset.sf)});
$('stats').addEventListener('click',e=>{const c=e.target.closest('[data-sf]');if(c)setSf(c.dataset.sf)});
function confirmEdit(a){
  form.innerHTML=`<h3>Edit ${esc(a.name)}?</h3><p style="margin:0">This asset is signed off as completed${a.by?' by '+esc(a.by):''}. Unlock it to change its status, photos or note. It locks again when you mark it complete or tap Lock.</p>
  <div class="btns"><button class="btn" value="x">Cancel</button><button class="btn pri" value="ok">Unlock to edit</button></div>`;
  dlg.returnValue='';dlg.showModal();
  dlg.onclose=()=>{if(dlg.returnValue==='ok'){unlocked.add(a.id);render();toast(a.name+' unlocked for editing')}};
}
$('who').addEventListener('click',()=>askName());

function openNote(a){
  const lk=isLocked(a);
  form.innerHTML=`<h3>${esc(a.name)} — note</h3><label>Remark for inspection${lk?' (locked — tap Edit on the card to change)':''}<textarea id="nt" maxlength="500" ${lk?'readonly':''}></textarea></label>
  <div class="btns"><button class="btn${lk?' pri':''}" value="x">Close</button>${lk?'':'<button class="btn pri" value="ok">Save note</button>'}</div>`;
  $('nt').value=a.note||'';dlg.returnValue='';dlg.showModal();
  dlg.onclose=()=>{if(dlg.returnValue==='ok'){const v=$('nt').value.trim();if(v!==(a.note||''))needName(()=>save(a.id,{note:v}))}};
}
$('addBtn').addEventListener('click',()=>needName(()=>{
  form.innerHTML=`<h3>Add asset</h3><label>Asset name<input id="an" required maxlength="40" placeholder="e.g. REX-009"></label>
  <label>Asset type<select id="at">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label>
  <div class="btns"><button class="btn" value="x" formnovalidate>Cancel</button><button class="btn pri" value="ok">Add</button></div>`;
  dlg.returnValue='';dlg.showModal();
  dlg.onclose=async()=>{if(dlg.returnValue!=='ok')return;const n=$('an').value.trim().toUpperCase(),t=$('at').value;if(!n)return;
    try{await apiPost({action:'add',name:n,type:t});toast(n+' added');load()}catch(e){toast(String(e.message).includes('exists')?n+' already exists':'Could not add asset')}};
}));

/* ---- Photos: many per asset, full quality in Drive, pick best 3 for the sign-off ---- */
const driveSrc=(id,w)=>'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+w;
const pimg=(id,w,cls,alt)=>`<img class="${cls}" data-pid="${esc(id)}" data-w="${w}" src="${driveSrc(id,w)}" alt="${esc(alt||'Asset photo')}" loading="lazy" decoding="async">`;
// If Drive won't serve the link directly, fetch the image through the sheet backend once.
document.addEventListener('error',async e=>{
  const im=e.target;if(!(im instanceof HTMLImageElement)||!im.dataset.pid||im.dataset.fb)return;
  im.dataset.fb='1';
  try{const j=await apiGet({action:'photo',id:im.dataset.pid,...(Number(im.dataset.w)<1000?{thumb:1}:{})});
    if(/^data:image\/(jpeg|png);base64,/.test(j.img))im.src=j.img}catch(x){}
},true);
const sorted=a=>{const s=a.picks.filter(id=>a.photos.some(p=>p.id===id));return s.concat(a.photos.map(p=>p.id).filter(id=>!s.includes(id))).slice(0,3)};

let galleryFor=null;
function openGallery(a){
  galleryFor=a.id;
  const draw=()=>{
    const x=assets.find(z=>z.id===galleryFor);if(!x)return;
    const lk=isLocked(x),n=x.photos.length;
    form.innerHTML=`<h3>${esc(x.name)} — photos (${n})</h3>
    <p class="gsub">${lk?'Locked. Tap Edit on the card to change photos.':'All photos are kept for reference. Choose the best 3 for each asset type in Sign-off documents.'}</p>
    ${n?`<div class="gal">${x.photos.slice().reverse().map(p=>{const k=x.picks.indexOf(p.id);return`<div class="gi" data-pid="${esc(p.id)}">
      <button type="button" class="gview" data-g="view" aria-label="View full size">${pimg(p.id,480,'gthumb',x.name)}</button>
      <div class="gbar2">${lk?'':`<button type="button" class="gb del" data-g="del" aria-label="Delete photo">Delete</button>`}</div>
      <div class="gmeta">${esc(p.by||'')}${p.by&&p.at?' · ':''}${p.at?esc(ago(p.at)):''}</div></div>`}).join('')}</div>`:'<div class="empty">No photos yet.</div>'}
    <div class="btns">${lk?'':'<button type="button" class="btn" data-g="add">+ Add photos</button>'}<button class="btn pri" value="x">Close</button></div>`;
  };
  draw();openGallery.draw=draw;
  dlg.returnValue='';if(!dlg.open)dlg.showModal();
  dlg.onclose=()=>{galleryFor=null;render()};
}
form.addEventListener('click',async e=>{
  const b=e.target.closest('[data-g]');if(!b||!galleryFor)return;
  const a=assets.find(z=>z.id===galleryFor);if(!a)return;
  const g=b.dataset.g,pid=b.closest('.gi')?.dataset.pid;
  if(g==='view'){viewPhoto(pid,a);return}
  if(isLocked(a))return;
  if(g==='add'){photoTarget=a.id;$('file').click();return}
  if(g==='pick'){
    let picks=a.picks.filter(id=>a.photos.some(p=>p.id===id));
    if(picks.includes(pid))picks=picks.filter(x=>x!==pid);
    else{if(picks.length>=3){toast('3 photos already chosen — unstar one first');return}picks.push(pid)}
    const before=a.picks;a.picks=picks;openGallery.draw();
    try{await apiPost({action:'picks',id:a.id,picks})}catch(x){a.picks=before;openGallery.draw();toast('Not saved — try again')}
    return}
  if(g==='del'){
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again to delete';b.classList.add('sure');setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='Delete';b.classList.remove('sure')}},3000);return}
    const bp=a.photos,bk=a.picks;a.photos=a.photos.filter(p=>p.id!==pid);a.picks=a.picks.filter(x=>x!==pid);openGallery.draw();
    try{await apiPost({action:'delphoto',id:a.id,photoId:pid});toast('Photo deleted')}catch(x){a.photos=bp;a.picks=bk;openGallery.draw();toast('Could not delete — try again')}
  }
});
function viewPhoto(pid,a){
  const v=$('viewer');v.innerHTML=`<button class="vclose" aria-label="Close">✕</button>${pimg(pid,2400,'vimg',a.name)}`;
  v.hidden=false;v.onclick=()=>{v.hidden=true;v.innerHTML=''};
}
// Keep the original file when it's a normal JPEG/PNG (no quality loss); otherwise convert at high quality.
async function prepare(file){
  if(/^image\/(jpeg|png)$/.test(file.type)&&file.size<=8*1024*1024)
    return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const r=Math.min(1,3200/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',.92)}
  finally{URL.revokeObjectURL(url)}
}
$('file').addEventListener('change',async e=>{
  const files=[...e.target.files],id=photoTarget;e.target.value='';if(!files.length||!id)return;
  let ok=0;
  for(let i=0;i<files.length;i++){
    toast(files.length>1?`Uploading photo ${i+1} of ${files.length}…`:'Uploading photo…');
    let img;try{img=await prepare(files[i])}catch(x){toast('This image format isn’t supported — try a JPEG');continue}
    try{const j=await apiPost({action:'photo',id,img});const a=assets.find(x=>x.id===id);
      if(a){a.photos=a.photos.concat([j.photo]);a.picks=j.picks||a.picks;a.photo=true;a.by=me;a.at=Date.now()}ok++;
      if(galleryFor===id&&openGallery.draw)openGallery.draw();}
    catch(x){toast(String(x.message).includes('limit')?'Photo limit reached for this asset':'Photo upload failed — try again')}
  }

 {key:'adt',tab:'ADTs',file:'ADTs',label:'ASSET TYPE',name:'Articulated Dump Trucks (ADT)',heading:'SIGN-OFF',
  match:a=>/^RADT/.test(a.id)||(a.type==='Articulated dump trucks'&&!/^R(ST|WT|FT)/.test(a.id)),
  rows:[['Fuel Level sensor','Ramjack'],[FMS,'Ramjack'],['RFID Tag','Ramjack'],['Rugged Tablet','Ramjack'],['CAN Kits/Electrical Access','SMT']]},
 {key:'sup',tab:'Support vehicles',file:'Support_Vehicles',label:'ASSET TYPE/ID',name:'Support Vehicles',heading:'SIGN-OFF',
  match:a=>/^R(ST|WT)/.test(a.id)||a.id==='RFT-004',
  rows:[['Fuel Level sensor','Ramjack'],[FMS,'Ramjack'],['RFID Tag','Ramjack'],['CAN Kits/Electrical Access','SMT']]},
 {key:'rex',tab:'Excavators',file:'Excavators',label:'ASSET TYPE/ID',name:'Excavators',heading:'SIGN-OFF',
  match:a=>/^REX/.test(a.id)||a.type==='Excavators',
  rows:[['Fuel Level sensor','Ramjack'],['Reactore FMS kit ( GPS, RUT, FMC, Antenna)','Ramjack'],['RFID Tags','Ramjack'],['Rugged Tablet','Ramjack'],['CAN Kits/Electrical Access','SMT']]},
 {key:'rdz',tab:'Dozers',file:'Dozers',label:'ASSET TYPE/ID',name:'Dozers',heading:'SIGN-OFF.',
  match:a=>/^RDZ/.test(a.id)||a.type==='Track dozers',
  rows:[['Fuel Level sensor','Ramjack'],[FMS,'Ramjack'],['RFID Tag','Ramjack'],['Electrical Access','Rabotec']]},
 {key:'rwl',tab:'Wheel loaders',file:'Wheel_Loaders',label:'ASSET TYPE /ID',name:'Wheel Loaders',heading:'SIGN-OFF',
  match:a=>/^RWL/.test(a.id)||a.type==='Wheel loaders',
  rows:[['Fuel Level sensor','Ramjack'],[FMS,'Ramjack'],['RFID Tags','Ramjack'],['CAN Kits/Electrical Access','SMT']]},
 {key:'rft',tab:'Fuel trucks',file:'Fuel_Trucks',label:'ASSET TYPE/ID',name:'Fuel Trucks',heading:'SIGN-OFF',
  match:a=>(/^RFT/.test(a.id)&&a.id!=='RFT-004')||a.type==='Fuel trucks',
  rows:[['RUT','Ramjack'],['RFID','Ramjack'],['Control panel','Ramjack']]}
];
const docOf=a=>DOCS.find(d=>d.match(a));
let docKey=store.get('ir.doc')||'adt',docsOpen=false,printAll=false,docPicks={};
const docAssets=d=>assets.filter(a=>a.status!=='na'&&docOf(a)===d).sort(natural);
// Current photo choice for each of the 3 boxes (ignores photos that were deleted since).
const slotsOf=d=>[0,1,2].map(i=>{const x=(docPicks[d.key]||[])[i];if(!x)return null;
  const a=assets.find(z=>z.id===x.a);return a&&a.photos.some(p=>p.id===x.p)?x:null});
// Value in the ASSET TYPE box: the type, plus the IDs when there are only a few.
const typeValue=(d,list)=>d.name+(list.length&&list.length<=4?' — '+list.map(a=>a.name).join(', '):'');

function pageHtml(d,n){
  const list=docAssets(d),done=list.filter(a=>a.status==='ready').length,yes=list.length&&done===list.length?'YES':'';
  const sl=slotsOf(d);
  const box=(k,cls)=>{const x=sl[k];return`<button type="button" class="ph ${cls}" data-slot="${k}" data-doc="${d.key}" aria-label="Choose photo ${k+1}">${x?pimg(x.p,2000,'',x.a+' photo'):'<span class="phint">Tap to choose photo '+(k+1)+'</span>'}</button>`};
  return`<div class="pg">
  <div class="ban-d"><img class="wm" src="${IMG.WM}" alt=""></div>
  <div class="ban-o"></div>
  <div class="t1">INSTALLATION<br>VERIFICATION AND<br>SIGN-OFF</div>
  <div class="t2">MINEONE FMS SOLUTION DEPLOYMENT</div>
  <img class="lw" src="${IMG.LOGO_W}" alt="Ramjack Technology Solutions">
  <div class="wl"></div><div class="t3">RABOTEC SYCAMORE<br>MINE, GUINEA</div><div class="gl"></div>
  <table class="at"><tr><td>${esc(d.label)}</td><td>${esc(typeValue(d,list))}</td></tr></table>
  <table class="hw"><tr><th>HARDWARE REQUIREMENT</th><th>Completed by</th><th>YES/NO</th></tr>
   ${d.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${yes}</td></tr>`).join('')}</table>
  <div class="ln l1"></div>${box(0,'p1')}${box(1,'p2')}${box(2,'p3')}<div class="ln l2"></div>
  <div class="soh">${esc(d.heading)}</div>
  <p class="sop">The undersigned acknowledges and confirms that the contracted scope detailed in this document has been fully completed for the specific asset and that all work has been performed in accordance with client’s approved best practices, applicable technical standards and specifications.</p>
  <table class="sg"><tr><th>Date</th><th>Name</th><th>Designation</th></tr><tr><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td></tr></table>
  <div class="fl"></div><img class="ld" src="${IMG.LOGO_D}" alt="Ramjack Technology Solutions"><div class="pn">Page | ${n}</div>
 </div>`;
}
function renderDocs(){
  if(!docsOpen)return;
  const d=DOCS.find(x=>x.key===docKey)||DOCS[0];
  $('dtabs').innerHTML=DOCS.map(x=>{const l=docAssets(x),dn=l.filter(a=>a.status==='ready').length;
    return`<button class="dtab" data-doc="${x.key}" aria-pressed="${x===d}">${esc(x.tab)} <small>${dn}/${l.length}</small></button>`}).join('');
  const list=docAssets(d),dn=list.filter(a=>a.status==='ready').length;
  $('dinfo').textContent=`${dn} of ${list.length} completed`+(list.length&&dn===list.length?' · YES shown':' · YES appears when all are completed')+' · tap a photo box to choose';
  const docs=printAll?DOCS.filter(x=>docAssets(x).length):[d];
  const items=docs.map((x,i)=>({k:x.key,h:pageHtml(x,1)})),host=$('pages'),keys=items.map(x=>x.k).join(',');
  if(host.dataset.keys!==keys){host.innerHTML=items.map(x=>`<div class="pgw" data-k="${x.k}"><div class="pgs">${x.h}</div></div>`).join('');host.dataset.keys=keys;
    [...host.children].forEach((w,i)=>w._h=items[i].h)}
  else [...host.children].forEach((w,i)=>{if(w._h!==items[i].h){w.firstElementChild.innerHTML=items[i].h;w._h=items[i].h}});
  fitPages();
}
function fitPages(){
  const host=$('pages');if(!host)return;const W=210*96/25.4,H=297*96/25.4,s=Math.min(1,(host.clientWidth-16)/W);
  host.style.setProperty('--s',s);host.querySelectorAll('.pgw').forEach(w=>{w.style.width=W*s+'px';w.style.height=H*s+'px'});
}
const refreshDocs=()=>{if(docsOpen&&!dlg.open)renderDocs()};

// Pick the photo for one box from all photos of that asset type.
function openPicker(d,slot){
  const list=docAssets(d).filter(a=>a.photos.length),cur=slotsOf(d)[slot];
  form.innerHTML=`<h3>${esc(d.tab)} — photo ${slot+1}</h3>
  <p class="gsub">Choose from every photo taken on ${esc(d.name)}.</p>
  ${list.length?`<div class="pick">${list.map(a=>`<div class="pa"><div class="pan">${esc(a.name)}</div><div class="gal">${a.photos.slice().reverse().map(p=>{
    const sel=cur&&cur.p===p.id,used=slotsOf(d).findIndex(x=>x&&x.p===p.id);
    return`<button type="button" class="gi ${sel?'picked':''}" data-pa="${esc(a.id)}" data-pp="${esc(p.id)}">${pimg(p.id,480,'gthumb',a.name)}${used>=0?`<span class="gnum">${used+1}</span>`:''}</button>`}).join('')}</div></div>`).join('')}</div>`
   :'<div class="empty">No photos yet. Add photos on the asset cards first.</div>'}
  <div class="btns">${cur?'<button type="button" class="btn danger" data-clear="1">Clear box</button>':''}<button class="btn pri" value="x">Close</button></div>`;
  dlg.returnValue='';dlg.showModal();
  form.onclick=async e=>{
    const b=e.target.closest('[data-pp],[data-clear]');if(!b)return;
    const next=slotsOf(d).slice(),pick=b.dataset.clear?null:{a:b.dataset.pa,p:b.dataset.pp};
    if(pick){const j=next.findIndex(x=>x&&x.p===pick.p);if(j>=0&&j!==slot)next[j]=next[slot]}
    next[slot]=pick;const before=docPicks[d.key];docPicks[d.key]=next;
    form.onclick=null;dlg.close();renderDocs();
    try{const r=await apiPost({action:'docpicks',doc:d.key,picks:next});docPicks[d.key]=r.picks}catch(x){docPicks[d.key]=before;renderDocs();toast('Not saved — try again')}
  };
  dlg.onclose=()=>{form.onclick=null;renderDocs()};
}
function openDocs(){
  if(!assets.length){toast('No assets loaded yet');return}
  docsOpen=true;const r=$('report');
  r.innerHTML=`<div class="rtools"><div class="dtabs" id="dtabs"></div>
   <div class="dact"><span id="dinfo"></span>
   <button class="btn" id="rclose">Close</button><button class="btn" id="rall">Print all types</button><button class="btn pri" id="rprint">Print this type</button></div></div><div id="pages"></div>`;
  r.hidden=false;document.body.style.overflow='hidden';
  $('dtabs').onclick=e=>{const t=e.target.closest('[data-doc]');if(t){docKey=t.dataset.doc;store.set('ir.doc',docKey);renderDocs();r.scrollTop=0}};
  $('pages').onclick=e=>{const b=e.target.closest('[data-slot]');if(b)openPicker(DOCS.find(x=>x.key===b.dataset.doc),Number(b.dataset.slot))};
  $('rclose').onclick=()=>{docsOpen=false;r.hidden=true;r.innerHTML='';document.body.style.overflow=''};
  const doPrint=(all)=>{const d=DOCS.find(x=>x.key===docKey)||DOCS[0],t=document.title;
    printAll=all;renderDocs();
    document.title='Ramjack_Installation_Verification_Signoff_-'+(all?'All_Asset_Types':d.file);
    setTimeout(()=>{window.print();setTimeout(()=>{document.title=t;printAll=false;renderDocs()},1200)},300)};
  $('rprint').onclick=()=>doPrint(false);$('rall').onclick=()=>doPrint(true);
  renderDocs();
}
window.addEventListener('resize',()=>{if(docsOpen)fitPages()});
$('repBtn').addEventListener('click',openDocs);



if(!API_URL){
  setSync(false,'Setup needed');
  $('board').innerHTML='<div class="msg err">This page isn’t connected to its Google Sheet yet. Paste the Apps Script web app URL into API_URL in index.html.</div>';
}else{
  $('addBtn').hidden=false;
  if(me)$('who').textContent='You: '+me;
  load();
  setInterval(()=>{if(document.visibilityState==='visible')load()},POLL_MS);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
  setInterval(()=>{if(assets.length&&busyRender())render()},60000);
}
}
</script>
</body>
</html>
